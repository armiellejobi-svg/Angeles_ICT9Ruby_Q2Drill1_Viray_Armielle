
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Q2 Drill 1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0860b8;
            font-family: Gill sans-serif;
        }

        .page-title {
            background-color: white;
            color: #222;
            border-radius: 15px;
            padding: 8px;
            margin-top: 18px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 5px 5px 8px black;
        }

        .picture-area {
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .picture-area img {
            max-width: 300px;
            max-height: 260px;
        }

        .guide-card {
            background-color: white;
            border-radius: 8px;
            padding: 18px;
            margin-top: 5px;
            min-height: 190px;
            box-shadow: 5px 5px 8px black;
        }

        .section-title {
            background-color: #f1d83d;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 20px;
            color: #222;
        }

        li {
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 class="page-title">Beginner's Guide to Pickleball</h1>
    </div>

    <div class="container">

        <div class="picture-area">
            <!-- ADD YOUR IMAGE HERE -->
            <img src="pickleball.png" alt="Pickleball picture">
        </div>

        <div class="row">

            <div class="col-md-4">
                <div class="guide-card">
                    <h2 class="section-title">Basic Rules</h2>
                    <ul>
                        <li>Serve diagonally</li>
                        <li>Double bounce rule</li>
                        <li>No volley zone</li>
                        <li>Scoring</li>
                    </ul>
                </div>
            </div>

            <div class="col-md-4">
                <div class="guide-card">
                    <h2 class="section-title">Pickleball Equipment</h2>
                    <ul>
                        <li>Paddle</li>
                        <li>Plastic ball</li>
                        <li>Net</li>
                        <li>Court</li>
                    </ul>
                </div>
            </div>

            <div class="col-md-4">
                <div class="guide-card">
                    <h2 class="section-title">Basic Techniques</h2>
                    <ul>
                        <li>Forehand and backhand strokes</li>
                        <li>Serving techniques</li>
                        <li>Dinking</li>
                        <li>Positioning</li>
                    </ul>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
